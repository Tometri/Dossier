<!DOCTYPE html>
<html lang="en">
  <head>
    <title>RSVP</title>
  </head>
  <body>
    <form>
      <form>
  <h2>RSVP</h2>
  <p>Come and make our special day more awesome!</p>
  <br>
  First Name: <input type="text" name="firstName">
  <br><br>
  Last Name: <input type="text" name="lastName">
  <br><br>
  Are you coming?<br>
  <input type="radio" name="invite" value="yes"> Yes
  <input type="radio" name="invite" value="no"> No
  <input type="radio" name="invite" value="maybe"> Maybe
  <br><br>
  Any dietary restrictions for main course?<br>
  <input type="checkbox" name="dietary" value="vegetarian"> Vegetarian
  <input type="checkbox" name="dietary" value="vegan"> Vegan
  <input type="checkbox" name="dietary" value="gluten-free"> Gluten-Free
  <br><br>
  <input type="submit" value="Submit">
 </form>
    </form>
  </body>
</html>
