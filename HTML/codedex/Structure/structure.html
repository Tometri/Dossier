<!--All HTML files must start with a DOCTYPE declaration -->
<!DOCTYPE html>
<!--The <html> element is the root element of an HTML page -->
<html>
<!--The <head> element contains meta information about the HTML page -->
<head>
    <!--The <title> element specifies a title for the HTML page (which is shown in the browser's title bar or on the page's tab) -->
    <title>HTML Structure</title>
</head>
<!--The <body> element contains the visible page content -->
<body>
    <!--The <h1> element defines a large heading -->
    <h1>HTML Structure</h1>
    <!--The <p> element defines a paragraph -->
    <p>HTML documents are structured with a head and a body. The head contains meta information about the document, while the body contains the content that is displayed to the user.</p>
</body>
</html>
